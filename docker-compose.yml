version: '3.8'

services:
  db-postgres:
    image: postgres:15-alpine 
    container_name: docker_plagcheck
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}           
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"                  
    volumes:
      - pg_data:/var/lib/postgresql/data 

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_plagcheck
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com # Silakan ganti sesuai keinginan
      PGADMIN_DEFAULT_PASSWORD: admin        # Silakan ganti sesuai keinginan
    ports:
      - "5050:80"
    depends_on:
      - db-postgres

volumes:
  pg_data: